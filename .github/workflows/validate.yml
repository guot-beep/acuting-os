name: validate

# The repo's real failure mode is not "no validators" — there are 28 of them.
# It is that nothing forced any of them to be RUN. On 2026-08-02 a batch was
# reported complete and the next agent had to re-measure it to find out the
# truth. Three agents now write in parallel (conditions/patterns, extra points,
# formulas), so from 2026-08-07 this gate is the only rule that reaches all
# three tools — Codex and Antigravity do not read .claude/skills/.
#
# Two tiers, on purpose:
#   green   validators that pass today. Any failure blocks the merge.
#   ratchet layers with an honest backlog (conditions 631, patterns 250).
#           Demanding zero would block every merge and the gate would be turned
#           off within a week. Demanding "no worse than the committed baseline"
#           is a gate that survives — and the numbers can only go down.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI 通知風暴處置(2026-08-12,Ting 授權):
#   1. concurrency:同一 PR(以 PR number 分組)或同一 branch(push/dispatch
#      以 ref 分組)同時只保留最新 run,舊 run 取消 —— 不同 PR 互不取消。
#   2. preflight 變更偵測:docs-only push(docs/** 與任何 *.md)不跑昂貴
#      validators,但 workflow 本身有明確 success 結論,不會永久 Pending。
#      任何 code/data/scripts/workflow 變更照舊全跑。
#   no-PHI gate(clinical-data-never-committed)永遠無條件執行 —— 它便宜、
#   而且是不准削弱的安全 gate。
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: change detection (docs-only skips heavy validators)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.detect.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify changed files
        id: detect
        run: |
          # 非 PR 事件(main push / manual dispatch)一律全跑。
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event — full CI."
            exit 0
          fi
          # 增量分類修正(2026-08-12 驗收實測):比對基準必須是「本次 push 的
          # 增量」(synchronize 事件的 event.before),不是 PR base——300+ commit
          # 的長 PR 對 main 累積 diff 永遠含 code,docs-only 永遠不會觸發。
          # opened/reopened 沒有增量概念 → 保守全跑。
          if [ "${{ github.event.action }}" = "synchronize" ] && [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -q "^000000"; then
            BASE="${{ github.event.before }}"
          else
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "PR ${{ github.event.action }} (no push delta) — full CI (conservative)."
            exit 0
          fi
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "before-SHA not in history (force push?) — full CI (conservative)."
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "changed files:"
          echo "$files"
          # docs-only = 每一個變更檔都是 docs/** 或任一 *.md(PROJECT_LOG.md、
          # CODEX_HANDOFF.md、AI_REVIEW_FEEDBACK.md、DRY_CLINIC_LOG.md…)。
          # 空 diff 視為異常,保守全跑。validators 不讀任何 .md,分類安全。
          if [ -z "$files" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "empty diff — full CI (conservative)."
            exit 0
          fi
          run_full=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md) ;;
              *) run_full=true; break ;;
            esac
          done <<< "$files"
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "classification: run_full=$run_full"

  green:
    name: green validators (blocking)
    needs: preflight
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # build-data first: everything downstream reads data/generated/*.
      - name: build data
        run: node scripts/build-data.js

      # If build-data changed a generated file, the PR is missing a rebuild.
      - name: generated data is committed and current
        run: |
          if ! git diff --quiet -- data/generated; then
            echo "::error::data/generated is stale — run 'node scripts/build-data.js' and commit the result."
            git --no-pager diff --stat -- data/generated
            exit 1
          fi

      - name: app.js parses
        run: node --check app.js

      # 開機順序守衛(2026-08-12):初始 render() 之後不得有頂層 const 宣告 ——
      # TDZ 會讓「資料剛好走到那條 render 路徑」的使用者整個 app 開不起來。
      - name: app boot order (no const in the TDZ of first render)
        run: node scripts/validate-boot-order.js

      - name: referential integrity
        run: node scripts/validate-relations.js

      # Graduated from the ratchet 2026-08-06: the 72 extra-point D2 ids were
      # backfilled (add-point-ids.js), validate-point-ids is green, so it now
      # blocks like everything else.
      - name: point ids and the id ledger (DECISIONS D2/D6)
        run: node scripts/validate-point-ids.js

      - name: runtime data
        run: node scripts/validate-data.js

      - name: interactions
        run: node scripts/validate-interactions.js

      - name: no scraped junk in content arrays
        run: node scripts/validate-content-junk.js

      # Condition safety layer.
      # These validators are currently zero-defect and must remain blocking.
      - name: red-flag registry
        run: node scripts/validate-red-flag-registry.js

      - name: batch 4 gyn legacy migration ledger
        run: node scripts/validate-gyn-legacy-migration.js

      - name: batch 1-3 legacy migration ledger
        run: node scripts/validate-b123-legacy-migration.js

      - name: canonical red-flag wiring
        run: node scripts/validate-red-flag-wiring.js
        
      - name: runtime red-flag resolver
        run: node scripts/validate-red-flag-runtime.js
        
      - name: FY2026 ICD crosswalk mappings
        run: node scripts/validate-crosswalk-mappings.js
        
      - name: acupoint card standard
        run: node scripts/validate-acupoint-standard.js

      - name: extra point standard
        run: node scripts/validate-extra-point-standard.js

      - name: herb card standard
        run: node scripts/validate-herb-standard.js

      - name: formula card standard
        run: node scripts/validate-formula-standard.js

      # FB-20 (docs/research_packs/FORMULA_EYESON_02.md F-32/F-41): composition-
      # signature duplicate detector. NOTE tier on purpose — 4 unresolved
      # exact-duplicate pairs exist in the live data today (see the script's
      # own report), so `--blocking` would break this job over content
      # nobody has fixed yet. This step runs informationally (always exits 0)
      # so every CI run surfaces the count; it graduates to blocking (add
      # `--blocking` below) once that count reaches 0 — mirroring how
      # `validate-point-ids` moved out of the ratchet job into an
      # unconditional failing step here on 2026-08-06. See the script header
      # for the exact graduation condition.
      - name: formula composition-signature duplicates (NOTE tier, see script header)
        run: node scripts/validate-formula-composition-signatures.js --worklist

      - name: comparison standard
        run: node scripts/validate-comparison-standard.js

      # sym.* has zero records by design (Batch A): the validator reports
      # "namespace built, no records yet" and exits 0. It blocks here from day
      # one so the first pilot batch cannot land defects silently — the
      # yardstick is on the wall before the content arrives (D14).
      - name: symptom standard
        run: node scripts/validate-symptom-standard.js

      # The edge registry had ZERO consumers until 2026-08-06 — D13 called it
      # "the authority on which fields are edges" while nothing parsed it. This
      # step is that consumer: every declared edge must resolve against real
      # data, including the nested form differentiation_zh[].points_to.
      - name: relation registry is machine-resolvable
        run: node scripts/validate-relation-registry.js

      # Codex audit 2026-08-11 §5: the K-series PHI validator was green but
      # nothing ran it in CI, so a K4 regression sailed through. Both clinical
      # gates block from now on — PHI regex on tracked clinical JSON, and the
      # Clinical V2 contract invariants (R1-R8) on the tracked sample files.
      - name: clinical PHI (K-series)
        run: node scripts/validate-clinical-case-standard.js

      - name: clinical contract invariants (R1-R8)
        run: node scripts/validate-clinical-invariants.js

      # AVS v3(2026-08-12,Codex NO-GO 修復後納入 blocking):建議庫規則
      # 驗證 + 引擎 E2E(§13 Scenario A–G + Codex HIGH-1/HIGH-3/MED-1 反例)。
      - name: AVS advice library standard
        run: node scripts/validate-avs-library.js

      - name: AVS checkout engine E2E (incl. Codex NO-GO probes)
        run: node scripts/test-avs-checkout.js

      # P1 pre-visit transport(2026-08-12,SOL/Codex transport audit HIGH-1/
      # HIGH-2/MED-1 修復後納入 blocking):payload shape + §7 必要欄位 +
      # metric 型別(禁 JS coercion)+ 自由文字長度上限。fixtures 全合成、零 PHI。
      - name: P1 previsit payload transport standard
        run: node scripts/validate-previsit-payload.js --self-test

      - name: whitespace / conflict markers
        run: git diff --check

  ratchet:
    name: defect ratchet (conditions · patterns · naming)
    needs: preflight
    if: needs.preflight.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: no layer may get worse than its committed baseline
        run: node scripts/check-validation-ratchet.js

  clinical-data-never-committed:
    name: no patient data in git (DECISIONS D4/D7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitignored clinical stores must stay out of the tree
        run: |
          # D7: the clinical layer lives in a gitignored store, never in git.
          # The template/sample files are de-identified and intentionally tracked,
          # so this checks the private dirs and database files only.
          bad=$(git ls-files \
            'data/clinical_cases/local/*' \
            'data/clinical_cases/private/*' \
            'data/clinical_cases/exports/*' \
            '*.db' '*.sqlite' '*.sqlite3' '*.phi.*')
          if [ -n "$bad" ]; then
            echo "::error::clinical/patient files are tracked in git:"
            echo "$bad"
            exit 1
          fi
          echo "clean — no clinical stores tracked."
